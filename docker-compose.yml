version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: saberpro-rabbitmq
    ports:
      - "5672:5672" # Puerto AMQP para microservicios
      - "15672:15672" # Consola web de administración (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
